services:

  mysql:
    container_name: mysql
    image: mysql:5.7

    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "devops"

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - two-tier-nt

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s


  flask-app:
    container_name: two-tier-app

    build:
      context: .

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: devops

    networks:
      - two-tier-nt

    depends_on:
      mysql:
        condition: service_healthy

    restart: always


volumes:
  mysql_data:


networks:
  two-tier-nt: